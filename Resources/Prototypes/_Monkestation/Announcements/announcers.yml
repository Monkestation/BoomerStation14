- type: weightedRandom
  id: announcers
  weights:
    DefaultAnnouncer: 5
    DukeAnnouncer: 5
    InternAnnouncer: 1
    MedbotAnnouncer: 1
    DagothAnnouncer: 5

- type: announcer
  id: DukeAnnouncer
  sounds:
    Attention:
      monoSound:
        collection: MSDukeAlertsMono
      stereoSound:
        collection: MSDukeAlerts
    GridPowerOff:
      monoSound:
        path: /Audio/_Monkestation/Announcements/Duke/power_off.mono.ogg
      stereoSound:
        path: /Audio/_Monkestation/Announcements/Duke/power_off.ogg
    GridPowerOn:
      monoSound:
        path: /Audio/_Monkestation/Announcements/Duke/power_on.mono.ogg
      stereoSound:
        path: /Audio/_Monkestation/Announcements/Duke/power_on.ogg
    Intercept:
      monoSound:
        path: /Audio/_Monkestation/Announcements/Duke/intercept.mono.ogg
      stereoSound:
        path: /Audio/_Monkestation/Announcements/Duke/intercept.ogg
    Welcome:
      monoSound:
        collection: MSDukeWelcomeMono
      stereoSound:
        collection: MSDukeWelcome
    Meteors:
      monoSound:
        path: /Audio/_Monkestation/Announcements/Duke/meteors.mono.ogg
      stereoSound:
        path: /Audio/_Monkestation/Announcements/Duke/meteors.ogg
    ShuttleCalled:
      monoSound:
        path: /Audio/_Monkestation/Announcements/Duke/shuttle_call.mono.ogg
      stereoSound:
        path: /Audio/_Monkestation/Announcements/Duke/shuttle_call.ogg
    ShuttleRecalled:
      monoSound:
        path: /Audio/_Monkestation/Announcements/Duke/shuttle_recall.mono.ogg
      stereoSound:
        path: /Audio/_Monkestation/Announcements/Duke/shuttle_recall.ogg
    ShuttleDock:
      monoSound:
        path: /Audio/_Monkestation/Announcements/Duke/shuttle_arrive.mono.ogg
      stereoSound:
        path: /Audio/_Monkestation/Announcements/Duke/shuttle_arrive.ogg

