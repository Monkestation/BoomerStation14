# Base benches
- type: entity
  abstract: true
  parent: SeatBase
  id: CDBenchBaseMiddle
  name: bench
  suffix: Middle
  description: Multiple seats spanning a single object. Truly a marvel of science.
  components:
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Sprite
    state: middle
  - type: Physics
    bodyType: Static

# Park benches
- type: entity
  parent: CDBenchBaseMiddle
  id: CDBenchParkMiddle
  name: park bench
  components:
  - type: Sprite
    sprite: _CD/Structures/Furniture/Bench/parkbench_wooden.rsi
  - type: Construction
    graph: Bench
    node: CDBenchParkMiddle

- type: entity
  parent: CDBenchParkMiddle
  id: CDBenchParkLeft
  suffix: Right
  components:
  - type: Sprite
    state: left
  - type: Construction
    graph: Bench
    node: CDBenchParkLeft

- type: entity
  parent: CDBenchParkMiddle
  id: CDBenchParkRight
  suffix: Left
  components:
  - type: Sprite
    state: right
  - type: Construction
    graph: Bench
    node: CDBenchParkRight

