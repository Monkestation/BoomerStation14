- type: gameMap
  id: pathfinder
  mapName: 'pathfinder'
  mapPath: /Maps/pathfinder.yml
  minPlayers: 0
  maxPlayers: 8
  stations:
    Pathfinder:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Pathfinder {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'NT'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency.yml
        - type: StationJobs
          availableJobs: # 21 jobs total w/o latejoins
            #command (1 - 2)
            Captain: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            #service (1 - 5)
            Bartender: [ 1, 1 ]
            Botanist: [ 1, 1 ]
            Chef: [ 1, 1 ]
            Janitor: [ 1, 1 ]
            ServiceWorker: [ 1, 1 ]
            #engineering (2 - 3)
            AtmosphericTechnician: [ 1, 1 ]
            StationEngineer: [ 1, 2 ]
            TechnicalAssistant: [ 1, 1] #Intern, not counted
            #medical (1 - 2)
            Chemist: [ 1, 1 ]
            MedicalDoctor: [ 1, 1 ]
            MedicalIntern: [ 1, 1 ] #Intern, not counted
            #science (2)
            Scientist: [ 1, 2 ]
            ResearchAssistant: [ 1, 1 ] #Intern, not counted
            #security (1 - 2)
            SecurityOfficer: [ 1, 2 ]
            SecurityCadet: [ 1, 1 ] #Intern, not counted
            #supply (1 - 3)
            CargoTechnician: [ 1, 1 ]
            SalvageSpecialist: [ 1, 2 ]
            #civilian (3)
            Passenger: [ -1, -1 ] #infinite, not counted
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]