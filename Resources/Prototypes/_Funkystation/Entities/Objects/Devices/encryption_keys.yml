- type: entity
  parent: EncryptionKey
  id: EncryptionKeyEmergency
  name: emergency encryption key
  description: An encryption key used by paramedics, brigmedics, and security dispatchers.
  components:
  - type: EncryptionKey
    channels:
    - Emergency
    defaultChannel: Emergency
  - type: Sprite
    layers:
    - state: crypt_gray # upstream name
    - state: label-emergency

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyHailing
  name: hailing encryption key
  description: An encryption key used for hailing passing ships.
  components:
  - type: EncryptionKey
    channels:
    - Hailing
    defaultChannel: Hailing
  - type: Sprite
    layers:
    - state: crypt_silver
    - state: com_label
